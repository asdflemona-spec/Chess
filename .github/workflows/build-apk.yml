name: Build Pocket Chess Log APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          rm -rf source
          mkdir -p source
          unzip -q PocketChessLog-v0.1-source.zip -d source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: |
          cd source
          chmod +x gradlew

      - name: Build debug APK
        run: |
          cd source
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find source -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketChessLog-v0.1-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
