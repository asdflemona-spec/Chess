name: Build Pocket Chess Log APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Unzip source
        run: |
          rm -rf source
          mkdir -p source
          unzip -q PocketChessLog-v0.1.2-source.zip -d source

      # ChessView가 Android View의 setEnabled(Boolean)과 충돌하는 문제 수정
      - name: Fix ChessView enabled collision
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "source/app/src/main/java/spec/asdflemona/"
              "pocketchess/MainActivity.kt"
          )

          s = p.read_text(encoding="utf-8")
          original = s

          # Android View 자체에 setEnabled(Boolean)이 있으므로
          # ChessView의 custom enabled property를 inputEnabled로 변경한다.
          s = s.replace("var enabled:", "var inputEnabled:")
          s = s.replace(" enabled =", " inputEnabled =")
          s = s.replace("!enabled", "!inputEnabled")
          s = s.replace("if (enabled", "if (inputEnabled")

          if s == original:
              raise SystemExit(
                  "Patch not applied: ChessView enabled property not found"
              )

          p.write_text(s, encoding="utf-8")

          print("ChessView enabled -> inputEnabled patch applied")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: |
          cd source
          chmod +x gradlew

      - name: Build debug APK
        run: |
          cd source
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find source -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketChessLog-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
